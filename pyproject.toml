[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "officemate-ai-pde3802"
version = "2.0.0"
description = "Ten-class real-photograph office-item classifier with source import, dataset audit, training, evaluation and no ROS"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.8,<5", "Pillow>=10,<13", "scikit-image>=0.22,<1", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]
[tool.setuptools.packages.find]
where = ["src"]
